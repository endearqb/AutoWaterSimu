route:
  receiver: compute-api-observer-placeholder
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: compute-api-critical-placeholder
      matchers:
        - service="autowatersimu-compute-api"
        - severity="critical"
      repeat_interval: 30m

    - receiver: compute-api-warning-placeholder
      matchers:
        - service="autowatersimu-compute-api"
        - severity="warning"
      repeat_interval: 4h

receivers:
  - name: compute-api-observer-placeholder

  - name: compute-api-critical-placeholder
    webhook_configs:
      - url: https://example.invalid/replace-with-production-critical-webhook
        send_resolved: true

  - name: compute-api-warning-placeholder
    webhook_configs:
      - url: https://example.invalid/replace-with-production-warning-webhook
        send_resolved: true
