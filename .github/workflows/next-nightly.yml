name: AutoWaterSimu Next Nightly Evidence

concurrency:
  group: next-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

'on':
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_fast:
    uses: ./.github/workflows/next-pr-fast.yml

  integration_smoke:
    uses: ./.github/workflows/next-integration-smoke.yml

  browser_smoke:
    uses: ./.github/workflows/next-browser-smoke.yml

  live_backend_browser_smoke:
    uses: ./.github/workflows/next-live-backend-browser-smoke.yml

  current_flow_live_smoke:
    uses: ./.github/workflows/next-current-flow-live-smoke.yml

  security_smoke:
    uses: ./.github/workflows/next-security-smoke.yml

  desktop_package_smoke:
    uses: ./.github/workflows/next-desktop-package-smoke.yml

  nightly-summary:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - pr_fast
      - integration_smoke
      - browser_smoke
      - live_backend_browser_smoke
      - current_flow_live_smoke
      - security_smoke
      - desktop_package_smoke
    steps:
      - name: Write nightly summary evidence
        run: |
          mkdir -p tmp/ci-evidence
          cat > tmp/ci-evidence/nightly-summary.json <<JSON
          {
            "schema_version": "autowatersimu_next_nightly_summary.v1",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "github_run_id": "${{ github.run_id }}",
            "github_run_attempt": "${{ github.run_attempt }}",
            "github_sha": "${{ github.sha }}",
            "github_ref": "${{ github.ref }}",
            "schedule": "17 18 * * *",
            "schedule_note": "UTC cron; approximately 02:17 Asia/Shanghai.",
            "jobs": {
              "pr_fast": "${{ needs.pr_fast.result }}",
              "integration_smoke": "${{ needs.integration_smoke.result }}",
              "browser_smoke": "${{ needs.browser_smoke.result }}",
              "live_backend_browser_smoke": "${{ needs.live_backend_browser_smoke.result }}",
              "current_flow_live_smoke": "${{ needs.current_flow_live_smoke.result }}",
              "security_smoke": "${{ needs.security_smoke.result }}",
              "desktop_package_smoke": "${{ needs.desktop_package_smoke.result }}"
            },
            "coverage_summary": {
              "release_evidence": "not_covered_by_nightly",
              "hosted_run": "covered_when_this_workflow_completes_in_github_actions"
            }
          }
          JSON

      - name: Upload nightly summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-nightly-summary-evidence
          path: tmp/ci-evidence/nightly-summary.json
          include-hidden-files: true
