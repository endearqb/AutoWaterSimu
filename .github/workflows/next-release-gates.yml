name: AutoWaterSimu Next Gates

concurrency:
  group: next-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/workflows/next-release-gates.yml"
      - "scripts/release/**"
      - "contracts/**"
      - "simulation_core/**"
      - "services/simulation-worker/**"
      - "apps/api/**"
      - "apps/desktop/**"
      - "frontend/src/client/compute/**"
      - "frontend/src/services/computeJobsService.ts"
  workflow_dispatch:
    inputs:
      mode:
        description: "Gate mode: merge or release"
        required: true
        default: "merge"
      sidecar_path:
        description: "Path to packaged simulation-worker sidecar on the runner"
        required: false
        default: ""
      installer_path:
        description: "Path to NSIS installer on the runner"
        required: false
        default: ""
      allow_missing_package_artifacts:
        description: "Allow release dry run to skip missing sidecar/installer artifacts"
        required: false
        default: "false"
      build_release_artifacts:
        description: "Build unsigned sidecar/NSIS artifacts on the runner before the gate"
        required: false
        default: "false"
      run_worker_matrix:
        description: "Run the heavier simulation-worker pytest matrix"
        required: false
        default: "false"
      run_browser_smoke:
        description: "Run mock-backed Compute Jobs and lifecycle Playwright smokes"
        required: false
        default: "false"
      run_postgres_migration_smoke:
        description: "Run PostgreSQL migration up/down smoke with a temporary service database"
        required: false
        default: "false"
      skip_long:
        description: "Skip long build steps in manual gate runs"
        required: false
        default: "false"

jobs:
  postgres-migration-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_postgres_migration_smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autowatersimu
          POSTGRES_PASSWORD: autowatersimu
          POSTGRES_DB: autowatersimu_compute_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autowatersimu -d autowatersimu_compute_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run PostgreSQL migration up/down smoke
        run: go test ./internal/compute -run 'TestPostgresMigrations(Up|Down)Smoke' -count=1
        working-directory: apps/api
        env:
          COMPUTE_API_DATABASE_URL: postgres://autowatersimu:autowatersimu@localhost:5432/autowatersimu_compute_ci?sslmode=disable
          COMPUTE_API_MIGRATION_DOWN_SMOKE: "true"

  next-gates:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.4.15"
          enable-cache: true

      - name: Install backend Python dependencies
        run: uv sync
        working-directory: backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_browser_smoke == 'true' }}
        run: npx playwright install chromium
        working-directory: frontend

      - name: Build packaged sidecar
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_release_artifacts == 'true' }}
        id: build_sidecar
        shell: powershell
        run: |
          $outputDir = "tmp\desktop-packaging\github-sidecar"
          .\apps\desktop\packaging\build-packaged-sidecar.ps1 -OutputDir $outputDir
          $manifestPath = Join-Path $outputDir "packaged-sidecar-build.json"
          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.sidecar_executable) -or -not (Test-Path -LiteralPath $manifest.sidecar_executable -PathType Leaf)) {
            throw "Packaged sidecar manifest did not point to an executable artifact."
          }
          "sidecar_path=$($manifest.sidecar_executable)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sidecar_dist_dir=$($manifest.dist_dir)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build NSIS installer
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_release_artifacts == 'true' }}
        id: build_installer
        shell: powershell
        run: |
          $sidecarPath = "${{ steps.build_sidecar.outputs.sidecar_path }}"
          if ([string]::IsNullOrWhiteSpace($sidecarPath)) {
            throw "Packaged sidecar output path was not available for installer build."
          }
          $evidenceDir = "tmp\desktop-packaging\github-nsis"
          .\apps\desktop\packaging\build-nsis-installer.ps1 -SidecarPath $sidecarPath -EvidenceDir $evidenceDir
          $manifestPath = Join-Path $evidenceDir "nsis-installer-build.json"
          $manifest = Get-Content -Path $manifestPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.installer_path) -or -not (Test-Path -LiteralPath $manifest.installer_path -PathType Leaf)) {
            throw "NSIS installer manifest did not point to an installer artifact."
          }
          "installer_path=$($manifest.installer_path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run Next gates
        shell: powershell
        run: |
          $mode = "${{ github.event.inputs.mode }}"
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = "merge"
          }
          $args = @("-Mode", $mode)
          $sidecarPath = "${{ github.event.inputs.sidecar_path }}"
          $builtSidecarPath = "${{ steps.build_sidecar.outputs.sidecar_path }}"
          if ([string]::IsNullOrWhiteSpace($sidecarPath) -and -not [string]::IsNullOrWhiteSpace($builtSidecarPath)) {
            $sidecarPath = $builtSidecarPath
          }
          if (-not [string]::IsNullOrWhiteSpace($sidecarPath)) {
            $args += @("-SidecarPath", $sidecarPath)
          }
          $installerPath = "${{ github.event.inputs.installer_path }}"
          $builtInstallerPath = "${{ steps.build_installer.outputs.installer_path }}"
          if ([string]::IsNullOrWhiteSpace($installerPath) -and -not [string]::IsNullOrWhiteSpace($builtInstallerPath)) {
            $installerPath = $builtInstallerPath
          }
          if (-not [string]::IsNullOrWhiteSpace($installerPath)) {
            $args += @("-InstallerPath", $installerPath)
          }
          if ("${{ github.event.inputs.allow_missing_package_artifacts }}" -eq "true") {
            $args += "-AllowMissingPackageArtifacts"
          }
          if ("${{ github.event.inputs.run_worker_matrix }}" -eq "true") {
            $args += "-RunWorkerMatrix"
          }
          if ("${{ github.event.inputs.run_browser_smoke }}" -eq "true") {
            $args += "-RunBrowserSmoke"
          }
          if ("${{ github.event.inputs.skip_long }}" -eq "true") {
            $args += "-SkipLong"
          }
          .\scripts\release\next-release-gates.ps1 @args

      - name: Upload unsigned release artifacts
        id: upload_unsigned_release_artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.build_release_artifacts == 'true' && steps.build_installer.outputs.installer_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: next-desktop-unsigned-release-artifacts
          path: |
            tmp/desktop-packaging/github-sidecar/dist/simulation-worker
            tmp/desktop-packaging/github-sidecar/packaged-sidecar-build.json
            tmp/desktop-packaging/github-sidecar/packaged-sidecar-smoke.json
            tmp/desktop-packaging/github-nsis/nsis-installer-build.json
            tmp/desktop-packaging/github-nsis/nsis-installer-smoke.json
            tmp/desktop-packaging/github-nsis/installed-sidecar-smoke.json
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Download uploaded unsigned release artifacts
        id: download_unsigned_release_artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.build_release_artifacts == 'true' && steps.build_installer.outputs.installer_path != '' && steps.upload_unsigned_release_artifacts.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: next-desktop-unsigned-release-artifacts
          path: tmp/downloaded-release-artifacts

      - name: Verify downloaded unsigned release artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.build_release_artifacts == 'true' && steps.build_installer.outputs.installer_path != '' && steps.download_unsigned_release_artifacts.outcome == 'success' }}
        shell: powershell
        run: |
          .\scripts\release\verify-release-artifact-download.ps1 `
            -DownloadRoot "tmp\downloaded-release-artifacts" `
            -EvidenceDir "tmp\release-evidence" `
            -ArtifactName "next-desktop-unsigned-release-artifacts"

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-release-gate-evidence
          path: tmp/release-evidence
          include-hidden-files: true
