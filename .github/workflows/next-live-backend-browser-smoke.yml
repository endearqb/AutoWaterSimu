name: AutoWaterSimu Next Live Backend Browser Smoke

concurrency:
  group: next-live-backend-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  live-backend-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.4.15"
          enable-cache: true

      - name: Install backend Python dependencies
        run: uv sync
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run live backend browser smoke evidence
        shell: pwsh
        run: ./scripts/ci/live-backend-browser-smoke.ps1

      - name: Upload live backend browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-live-backend-browser-smoke-evidence
          path: tmp/ci-evidence
          include-hidden-files: true
