[project]
name = "autowatersimu-simulation-core"
dynamic = ["version"]
description = "Pure Python simulation core for AutoWaterSimu Next"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pydantic>2.0",
    "scipy>=1.10.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
    "torchdiffeq>=0.2.3,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "autowatersimu_simulation_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["autowatersimu_simulation_core"]
